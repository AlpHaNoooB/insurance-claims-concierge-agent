<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claims Adjuster Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Claims Adjuster Dashboard</h1>
            <div class="subtitle">Human-in-the-Loop Review Queue</div>
        </header>

        <main id="app">
            <div class="empty-state">Loading pending claims...</div>
        </main>
    </div>

    <script>
        const app = document.getElementById('app');

        async function fetchPendingClaims() {
            try {
                const response = await fetch('/api/pending');
                const data = await response.json();
                renderClaims(data.pending_claims);
            } catch (error) {
                app.innerHTML = `<div class="empty-state" style="color: #fca5a5;">Error loading claims: ${error.message}</div>`;
            }
        }

        async function takeAction(sessionId, decision) {
            try {
                const btn = document.getElementById(`btn-${decision}-${sessionId}`);
                const originalText = btn.innerText;
                btn.innerText = "Processing...";
                btn.disabled = true;

                const response = await fetch(`/api/action/${sessionId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ decision: decision, notes: `Action taken via UI: ${decision}` })
                });

                if (response.ok) {
                    // Remove card and reload
                    fetchPendingClaims();
                } else {
                    alert('Failed to process action');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                alert('Error connecting to server');
            }
        }

        function renderClaims(claims) {
            if (!claims || claims.length === 0) {
                app.innerHTML = `
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem; opacity: 0.5;">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        <div>No pending claims require human review at this time.</div>
                    </div>`;
                return;
            }

            let html = '<div class="grid">';
            claims.forEach(claim => {
                const traps = claim.risk_data?.traps || [];
                const trapsHtml = traps.length > 0 
                    ? `<div class="traps-section">
                        <div class="traps-title">⚠️ Financial Traps Detected</div>
                        <ul class="traps-list">
                            ${traps.map(t => `<li>${t}</li>`).join('')}
                        </ul>
                       </div>`
                    : `<div class="traps-section" style="border-left-color: var(--success); background: rgba(46, 204, 113, 0.1);">
                        <div class="traps-title" style="color: #86efac;">✅ No Traps Detected</div>
                       </div>`;

                html += `
                    <div class="card" id="card-${claim.session_id}">
                        <div class="card-header">
                            <span class="policy-id">${claim.policy_id}</span>
                            <span style="color: var(--text-muted); font-size: 0.8rem;">Est. $${claim.cost}</span>
                        </div>
                        <div class="hospital">${claim.hospital}</div>
                        <div class="treatment">${claim.treatment}</div>
                        
                        ${trapsHtml}

                        <div class="actions">
                            <button id="btn-proceed-${claim.session_id}" class="btn-approve" onclick="takeAction('${claim.session_id}', 'proceed')">Approve Risk</button>
                            <button id="btn-cancel-${claim.session_id}" class="btn-reject" onclick="takeAction('${claim.session_id}', 'cancel')">Reject Claim</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            app.innerHTML = html;
        }

        // Initial load
        fetchPendingClaims();
        // Poll every 3 seconds for new claims
        setInterval(fetchPendingClaims, 3000);
    </script>
</body>
</html>
